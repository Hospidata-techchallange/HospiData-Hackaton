spring :
  datasource:
    url: jdbc:mariadb://hospidata-db:3306/stock_schema
    username: stock-agent
    password: password
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      pool-name: HikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 600000

  ai:
    mcp:
      server:
        endpoint: /mcp
        protocol: streamable
        stdio: false

  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true
  #   database-platform: org.hibernate.dialect.MariaDBDialect
  #   properties:
  #     hibernate:
  #       format_sql: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: br.com.hospidata.stock_mcp_service.dto
  configuration:
    map-underscore-to-camel-case: true

server :
  port : 8086
